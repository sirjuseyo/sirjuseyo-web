<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* ── 리셋 ── 클래스 선택자만 사용. ID 선택자로 * 리셋 금지(우선순위 충돌 원인) ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #fff;
    color: #1A1A2E;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 페이지 래퍼 : menu.js 상단바(max-width:480px)와 폭 일치 ── */
  .tip-page {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── 히어로 ── */
  .tip-hero {
    background: #380097;
    color: #fff;
    padding: 34px 24px 30px;
  }
  .tip-hero-emoji {
    font-size: 44px;
    line-height: 1;
  }
  .tip-hero-title {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -.8px;
    margin-top: 10px;
  }
  .tip-hero-desc {
    font-size: 13px;
    font-weight: 400;
    color: #C3B2F5;
    line-height: 1.65;
    margin-top: 10px;
  }

  /* ── 목록 ── 5개 항목 모두 동일. 상태 구분 없음 ── */
  .tip-list {
    display: block;
    padding: 6px 24px 32px;
  }

  .tip-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 0;
    border-bottom: 1px solid #F0EDF7;
    text-decoration: none;
    color: #1A1A2E;
  }
  .tip-item:last-child { border-bottom: none; }
  .tip-item:active { background: #FBFAFF; }

  .tip-num {
    font-size: 13px;
    font-weight: 900;
    color: #C3B2F5;
    letter-spacing: .5px;
    line-height: 1.5;
    flex-shrink: 0;
  }

  .tip-body {
    flex: 1;
    min-width: 0;
  }
  .tip-name {
    display: block;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: -.5px;
    line-height: 1.35;
  }
  .tip-desc {
    display: block;
    font-size: 12.5px;
    font-weight: 400;
    color: #9A9AA8;
    line-height: 1.6;
    margin-top: 5px;
  }

  .tip-icon {
    font-size: 20px;
    line-height: 1.3;
    flex-shrink: 0;
  }

  /* ── 접근성 ── */
  .tip-item:focus-visible {
    outline: 2px solid #380097;
    outline-offset: 2px;
    border-radius: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
