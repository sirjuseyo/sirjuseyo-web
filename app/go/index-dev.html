<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>[DEV] 써주세요. 앱으로 이동 중…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--purple:#380097;--orange:#FF5400;--cream:#FAF7F2;--text:#1A1A2E;--gray:#888;}
html,body{height:100%;background:var(--cream);font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);}
.wrap{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
.logo{font-size:1.15rem;font-weight:900;letter-spacing:-.5px;margin-bottom:28px;}
.logo em{font-style:normal;color:var(--purple);}
.spinner{width:38px;height:38px;border:3px solid rgba(56,0,151,.15);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:22px;}
@keyframes spin{to{transform:rotate(360deg);}}
.msg{font-size:1rem;font-weight:700;line-height:1.7;margin-bottom:8px;}
.sub{font-size:.85rem;font-weight:300;color:var(--gray);line-height:1.7;margin-bottom:28px;}
.btn{display:block;width:100%;max-width:320px;text-align:center;background:var(--orange);color:#fff;font-size:1.05rem;font-weight:700;border-radius:14px;padding:15px 20px;text-decoration:none;letter-spacing:-.2px;margin-bottom:10px;border:none;cursor:pointer;font-family:inherit;}
.btn-ghost{display:block;width:100%;max-width:320px;text-align:center;background:transparent;color:var(--purple);font-size:.95rem;font-weight:700;border:2px solid var(--purple);border-radius:14px;padding:13px 20px;text-decoration:none;letter-spacing:-.2px;}
.hide{display:none !important;}
.grad-bar{width:48%;max-width:220px;height:3px;border-radius:10px;background:linear-gradient(90deg,var(--purple),#A6D6DE,var(--orange));margin-top:36px;}
</style>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────
     앱링크 중계 페이지 (W-180 / T-180)
     카카오톡은 커스텀 스킴을 메시지로 전송할 수 없어 https 중계가 필요함.
     사용자에게 콘텐츠를 보여주는 페이지가 아니라 0.1초 통과 지점이다.

     URL   : /app/go?screen=monthly_loan | loan_checker
     동작   : 스킴 실행 → 앱 있으면 열림 / 없으면 타이머 만료 후 스토어
     iOS   : Universal Link가 먼저 앱을 잡으면 이 페이지에 도달하지 않음.
             도달했다 = 미설치 또는 UL 실패 → 스킴 → 스토어
     ───────────────────────────────────────────────────────────── -->
<div class="wrap">
  <!-- DEV 환경 표시 배너 -->
  <div style="background:#FF5400;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;letter-spacing:0.5px;width:100%;margin-bottom:20px;border-radius:8px;">
    🚧 DEV 테스트 환경 — 실사용자 접근 금지
  </div>
  <div class="logo">써주세요<em>.</em></div>

  <!-- 모바일: 이동 중 안내 -->
  <div id="mobile-view">
    <div class="spinner"></div>
    <div class="msg">앱으로 이동하고 있어요</div>
    <div class="sub">잠시만 기다려 주세요.<br>자동으로 열리지 않으면 아래 버튼을 눌러 주세요.</div>
    <!-- 카톡 인앱 브라우저가 자동 스킴 실행을 막는 경우가 있어 수동 버튼을 안전망으로 둔다 -->
    <button type="button" class="btn" id="btn-open">앱으로 열기</button>
    <a class="btn-ghost" id="btn-store" href="#">앱 설치하기</a>
  </div>

  <!-- PC에서 열었을 때 -->
  <div id="pc-view" class="hide">
    <div class="msg">모바일에서 열어 주세요</div>
    <div class="sub">이 링크는 써주세요. 앱으로 연결됩니다.<br>휴대폰에서 다시 눌러 주세요.</div>
    <a class="btn" href="https://www.sirjuseyo.com/index-dev.html">써주세요. 홈으로 (DEV)</a>
  </div>

  <!-- 주소가 잘못됐을 때 (screen 값 누락·오타·깨진 인코딩) -->
  <div id="error-view" class="hide">
    <div class="msg">연결할 수 없는 링크예요</div>
    <div class="sub">주소가 잘못되었거나 만료된 링크입니다.<br>아래에서 바로 이동해 주세요.</div>
    <a class="btn" id="err-loan" href="#">🔟🈷️ 이달의 대출 보기</a>
    <a class="btn-ghost" id="err-checker" href="#">대출 가능성 검사기</a>
  </div>

  <div class="grad-bar"></div>
</div>

<script>
(function () {
  'use strict';

  /* ── 설정값 ──────────────────────────────────────────────
     정책: 액션값은 Android(W-898)·iOS(W-087)와 합의된 고정 문자열.
           앱 측은 대소문자 무관 비교하지만 합의 표기를 그대로 쓴다. */
  /* DEV 전용 — 플랫폼별 스킴 분기 (T-181 / iOS 요청 2026-10-09)
     원인: iOS는 두 앱이 같은 스킴을 쓰면 선택 창 없이 임의의 앱을 연다(안드로이드와 다름).
           그래서 iOS DEV 빌드만 번들·스킴을 분리했다 — com.albit.SirJuseo.dev / sirjuseyo-dev://
     제약: 안드로이드는 DEV도 sirjuseyo:// 를 그대로 쓴다. 분리 의사 미확인 상태라
           플랫폼으로 갈라 두면 안드로이드가 나중에 분리해도 이 한 줄만 고치면 된다.
     주의: PRD 페이지(index.html)는 양쪽 모두 sirjuseyo:// 이며 이 분기를 넣지 않는다. */
  var DEV_SCHEME_IOS     = 'sirjuseyo-dev://';
  var DEV_SCHEME_ANDROID = 'sirjuseyo://';
  var ACTIONS = {
    monthly_loan: 'MONTHLY_LOAN',   // 앱 - 월별 대출 안내
    loan_checker: 'LOAN_CHECKER'    // 앱 - 대출 가능성 검사기
  };
  var STORE = {
    android: 'https://play.google.com/store/apps/details?id=company101.fundlock',
    ios:     'https://apps.apple.com/kr/app/id1277639490'
  };
  var HOME = 'https://www.sirjuseyo.com/index-dev.html';
  var LINK_LOAN    = 'https://www.sirjuseyo.com/monthly-loan/2026-10/index-dev.html';
  var LINK_CHECKER = 'https://www.sirjuseyo.com/tip/loan-checker/index-dev.html';   // DEV는 DEV 홈으로
  var FALLBACK_MS = 1800;   // 요청 사양: 1.5~2초 내 이탈 없으면 스토어

  /* ── 쿼리 파싱 ──────────────────────────────────────────
     제약: GitHub Pages는 정적 호스팅이라 서버 라우팅이 없다.
           /app/go?screen=... 를 app/go/index.html 이 받아 JS로 직접 읽는다. */
  function getScreen() {
    var m = /[?&]screen=([^&#]*)/.exec(location.search);
    if (!m) return '';
    // 제약: decodeURIComponent 는 '%' 같은 불완전 인코딩에서 URIError 를 던진다.
    //       잡지 않으면 스크립트 전체가 멈춰 페이지가 아무 동작도 하지 않는다.
    try {
      return decodeURIComponent(m[1]).toLowerCase();
    } catch (e) {
      return '';   // 잘못된 인코딩은 미지정과 동일하게 취급 → 안내 화면
    }
  }

  var screen = getScreen();
  // 제약: ACTIONS[screen] 직접 접근은 프로토타입 키(constructor·toString·__proto__ 등)가
  //       truthy 로 잡혀 엉뚱한 스킴이 만들어진다. 자기 자신의 키인지 반드시 확인한다.
  var action = Object.prototype.hasOwnProperty.call(ACTIONS, screen) ? ACTIONS[screen] : null;
  var schemeUrl = null;   // isIOS 판별 후 아래에서 조립한다

  /* ── 플랫폼 판별 ────────────────────────────────────────
       iPadOS 13+ 는 UA가 Macintosh로 나오므로 터치 지원 여부로 보강한다. */
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (/Macintosh/i.test(ua) && typeof document.ontouchend !== 'undefined');
  var isMobile = isAndroid || isIOS;

  var storeUrl = isIOS ? STORE.ios : STORE.android;

  // 스킴 조립 — 플랫폼 판별이 끝난 뒤여야 한다
  var SCHEME_BASE = (isIOS ? DEV_SCHEME_IOS : DEV_SCHEME_ANDROID) + 'intro?service=nano&action=';
  if (action) schemeUrl = SCHEME_BASE + action;
  var btnStore = document.getElementById('btn-store');
  if (btnStore) btnStore.href = storeUrl;

  /* ── 앱으로 보낼 수 없는 경우 — 원인별로 다른 화면을 보여준다 ─────
     주의: PC 접속과 '주소 오류'는 원인이 전혀 다르다. 한 화면으로 묶으면
           휴대폰에서 잘못된 주소를 열었을 때 "모바일에서 열어 주세요"라는
           말이 안 되는 안내가 뜬다. 반드시 분리할 것. */
  function showOnly(id) {
    document.getElementById('mobile-view').classList.add('hide');
    document.getElementById('pc-view').classList.add('hide');
    document.getElementById('error-view').classList.add('hide');
    document.getElementById(id).classList.remove('hide');
  }

  if (!isMobile) {
    showOnly('pc-view');            // PC → 휴대폰에서 열라고 안내
    return;
  }
  if (!action) {
    // 모바일인데 screen 값이 없거나 잘못됨 → 갈 곳을 직접 제시
    var el1 = document.getElementById('err-loan');
    var el2 = document.getElementById('err-checker');
    if (el1) el1.href = LINK_LOAN;
    if (el2) el2.href = LINK_CHECKER;
    showOnly('error-view');
    return;
  }

  /* ── 앱 실행 시도 ───────────────────────────────────────
     원리: 앱이 열리면 이 페이지가 백그라운드로 내려간다.
           그 순간을 감지해 스토어 이동 타이머를 취소한다.
     주의: 타이머만 쓰면 앱이 열린 뒤에도 스토어가 뜨는 오동작이 생긴다. */
  var timer = null;
  var moved = false;

  function cancel() {
    moved = true;
    if (timer) { clearTimeout(timer); timer = null; }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) cancel();
  });
  window.addEventListener('pagehide', cancel);
  window.addEventListener('blur', cancel);

  function launch() {
    if (moved) return;
    // iOS는 미설치 시 '주소를 열 수 없습니다' 팝업이 뜰 수 있다.
    // Universal Link가 정상 동작하면 이 페이지 자체에 도달하지 않으므로,
    // 여기까지 왔다는 건 미설치이거나 UL 실패 상황이다.
    try { location.href = schemeUrl; } catch (e) {}

    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      if (moved || document.hidden) return;
      location.replace(storeUrl);
    }, FALLBACK_MS);
  }

  // 수동 버튼 — 카톡 인앱에서 자동 실행이 막혔을 때의 안전망
  var btnOpen = document.getElementById('btn-open');
  if (btnOpen) {
    btnOpen.addEventListener('click', function () {
      moved = false;
      launch();
    });
  }

  // 진입 즉시 1회 시도
  launch();
})();
</script>
</body>
</html>
