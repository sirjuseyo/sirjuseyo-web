<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 · 써주세요.</title>
<meta name="description" content="써주세요. 공지사항은 앱에서 확인하실 수 있습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #FAF7F2;
  color: #1A1A2E;
  -webkit-font-smoothing: antialiased;
}

.nt-page {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 60px;
}

/* ── 히어로 ── */
.nt-hero {
  padding: 44px 24px 32px;
  text-align: center;
}

.nt-icon {
  width: 76px;
  height: 76px;
  background: linear-gradient(135deg, #FFF0E8, #FFE0CC);
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  margin: 0 auto 22px;
  box-shadow: 0 6px 20px rgba(255, 84, 0, .12);
}

.nt-title {
  font-size: 1.35rem;
  font-weight: 900;
  color: #1A1A2E;
  line-height: 1.55;
  letter-spacing: -.5px;
  margin-bottom: 12px;
}

.nt-title em {
  font-style: normal;
  color: #FF5400;
}

.nt-sub {
  font-size: .88rem;
  color: #888;
  line-height: 1.85;
}

/* ── 앱 안내 카드 ── */
.nt-card {
  margin: 0 20px 16px;
  background: #fff;
  border-radius: 18px;
  padding: 24px 20px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
  border: 2px solid #FF5400;
}

.nt-card-label {
  font-size: .75rem;
  font-weight: 700;
  color: #FF5400;
  margin-bottom: 8px;
  letter-spacing: .3px;
}

.nt-card-title {
  font-size: 1rem;
  font-weight: 900;
  color: #1A1A2E;
  margin-bottom: 8px;
  letter-spacing: -.3px;
}

.nt-card-desc {
  font-size: .85rem;
  color: #888;
  line-height: 1.75;
  margin-bottom: 16px;
}

.nt-card-path {
  background: #F8F6FF;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: .82rem;
  color: #380097;
  font-weight: 600;
  margin-bottom: 16px;
  letter-spacing: -.2px;
}

.nt-card-btn {
  display: block;
  text-align: center;
  background: #FF5400;
  color: #fff;
  font-size: .95rem;
  font-weight: 700;
  border-radius: 14px;
  padding: 14px;
  text-decoration: none;
  letter-spacing: -.2px;
}

/* ── 예정 안내 ── */
.nt-coming {
  margin: 0 20px;
  background: rgba(56, 0, 151, .04);
  border: 1.5px solid rgba(56, 0, 151, .15);
  border-radius: 14px;
  padding: 18px 20px;
  text-align: center;
}

.nt-coming-text {
  font-size: .85rem;
  color: #380097;
  font-weight: 600;
  line-height: 1.75;
}
</style>
</head>
<body data-breadcrumb="공지사항">

<main>
  <div class="nt-page">

    <div class="nt-hero">
      <div class="nt-icon">📢</div>
      <h1 class="nt-title">지금은 <em>앱에서</em><br>확인해 주세요.</h1>
      <p class="nt-sub">써주세요. 앱 공지사항에서<br>새 소식을 가장 빠르게 받아볼 수 있어요.</p>
    </div>

    <div class="nt-card">
      <div class="nt-card-label">📱 앱 공지사항 바로가기</div>
      <div class="nt-card-title">써주세요. 앱을 열어보세요</div>
      <div class="nt-card-desc">대출 일정, 이벤트, 정책 변경 소식을<br>앱 공지사항에서 확인할 수 있어요.</div>
      <div class="nt-card-path">앱 실행 → 하단 탭 → 공지사항</div>
      <a class="nt-card-btn" href="https://play.google.com/store/apps/details?id=company101.fundlock" target="_blank" rel="noopener">앱에서 공지사항 보기 →</a>
    </div>

    <div class="nt-coming">
      <p class="nt-coming-text">
        곧 이 페이지에서도<br>
        공지사항을 바로 확인할 수 있게 됩니다 🙌
      </p>
    </div>

  </div>
</main>

<script src="/js/popup.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/legal-shared.js"></script>
</body>
</html>
